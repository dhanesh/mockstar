# Satisfies: RT-13 (per-persona 5-minute smoke path — Dev / SDET / DevOps)
#
# Runs on every PR + a weekly cron. Each job exercises ONE persona's first
# five minutes end-to-end. A job exceeding `timeout-minutes: 5` fails — this
# IS the SLO check, not just a CI guardrail.

name: quickstart-smoke

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC — catches dependency rot

permissions:
  contents: read

jobs:
  dev-persona:
    name: Dev — bunx init + serve
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Dev 5-minute path
        run: |
          set -euo pipefail
          # Register the freshly-built package globally, then link it by NAME into a
          # scratch project so `bunx @dhanesh/mockstar` resolves to the local build. (Passing a
          # path directly to `bun link` is rejected as an unrecognised dependency format.)
          (cd "${GITHUB_WORKSPACE}" && bun link)
          WORK=$(mktemp -d)
          cd "$WORK"
          echo '{"name":"smoke","version":"0.0.0","private":true}' > package.json
          bun link @dhanesh/mockstar
          bunx @dhanesh/mockstar init .
          test -f ./mocks/default/example.json
          test -f ./mockstar.config.json
          bunx @dhanesh/mockstar ./mocks --port 4017 &
          SERVER_PID=$!
          trap "kill ${SERVER_PID} 2>/dev/null || true" EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4017/hello > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:4017/hello | tee /dev/stderr | grep -q "Hello from mockstar"
          # Response bodies are compact JSON (no space after the colon).
          curl -sf http://127.0.0.1:4017/users/42 | tee /dev/stderr | grep -q '"id":"42"'

  sdet-persona:
    name: SDET — npm i + jest test via launch()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Pack + install into scratch project
        run: |
          set -euo pipefail
          PKG=$(npm pack --silent)
          mv "$PKG" "${GITHUB_WORKSPACE}/mockstar.tgz"
          SCRATCH="${GITHUB_WORKSPACE}/_sdet"
          mkdir -p "$SCRATCH"
          cp -r examples/sdet-jest30/. "$SCRATCH/"
          cd "$SCRATCH"
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund "${GITHUB_WORKSPACE}/mockstar.tgz"
          # Use the example's own test script — it sets NODE_OPTIONS=--experimental-vm-modules
          # (via cross-env) so Jest can parse the ESM example. Calling `npx jest` directly
          # bypasses that and fails with "Cannot use import statement outside a module".
          npm test

  devops-persona:
    name: DevOps — docker run + /health
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build container locally
        run: docker build -t mockstar:smoke .
      - name: Run + probe /health
        run: |
          set -euo pipefail
          # The hardened image is lean (examples are not baked in); mount mock content at
          # runtime, mirroring the Helm chart's ConfigMap volume pattern. Default CMD serves
          # /config/mocks; named handlers resolve from /config/handlers.
          CID=$(docker run -d -p 4018:3000 \
            -v "${GITHUB_WORKSPACE}/examples/mocks:/config/mocks:ro" \
            -v "${GITHUB_WORKSPACE}/examples/handlers:/config/handlers:ro" \
            mockstar:smoke)
          trap "docker rm -f ${CID} > /dev/null || true" EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4018/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sfi http://127.0.0.1:4018/health | head -1 | grep -q "200"
