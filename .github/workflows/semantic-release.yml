name: semantic-release

# Automated releases. On every push to main, semantic-release reads the
# conventional-commit history, decides the next SemVer, updates CHANGELOG.md +
# package.json + schema/* + src/version.ts, commits them back, and creates the
# `vX.Y.Z` tag. The `publish` job then calls release.yml DIRECTLY (workflow_call)
# to do the actual publish (npm, binaries, multi-arch container -> ghcr.io, helm
# OCI, GitHub Release, cosign, SLSA).
#
# Why workflow_call instead of letting the tag push trigger release.yml: a tag push
# is subject to GitHub's [skip ci] scan of the (whole) commit message — and the
# release commit carries [skip ci]. Calling release.yml directly makes publishing
# independent of the tag-push event firing.
#
# REQUIRED SECRET: RELEASE_PAT — a fine-grained PAT with `contents: write`, used by
# semantic-release to push the version-bump commit + tag. Until it's set, the job
# no-ops with a warning (stays green). See docs/releasing.md.

on:
  push:
    branches: [main]

# Union of what the release job (semantic-release) and the release.yml reusable
# workflow need; workflow-level perms cap the called workflow's jobs.
permissions:
  contents: write # semantic-release commit/tag + release.yml GitHub Release
  packages: write # release.yml: ghcr container + helm OCI push
  id-token: write # release.yml: cosign keyless, SLSA, npm provenance
  attestations: write # release.yml: build attestations
  actions: read # release.yml: SLSA generator

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    # Defense-in-depth against self-retrigger: the bump commit carries [skip ci]
    # (which already suppresses this workflow on that push), and this guard skips
    # `chore(release):` commits regardless.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
    steps:
      - name: gate on RELEASE_PAT
        id: gate
        run: |
          if [ -n "${{ secrets.RELEASE_PAT }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_PAT not set — automated release skipped. See docs/releasing.md to enable."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: '20'

      # bun + deps power the @semantic-release/exec prepareCmd (generate-schema +
      # sync-version) that keeps schema/* and src/version.ts synced to the bump.
      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.ready == 'true'
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
        if: steps.gate.outputs.ready == 'true'

      - name: semantic-release
        id: semrel
        if: steps.gate.outputs.ready == 'true'
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
            @semantic-release/exec@6
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

  # Publish the freshly-cut release by calling release.yml directly (workflow_call) —
  # no dependency on the tag-push event, so [skip ci] on the release commit can't
  # suppress publishing.
  publish:
    needs: release
    if: ${{ needs.release.outputs.published == 'true' }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    secrets: inherit
