name: release

# Satisfies: U2 (4 distribution channels), TN4 (per-channel SLO)
# BUILD-ONLY release workflow. Publishing to npm + GHCR is deliberately commented out
# below — uncomment when NPM_TOKEN and ghcr.io write scope are configured on the repo.
# Each tag push produces downloadable artifacts; turning them into published versions
# is a deliberate manual step.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip actual artifact upload'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-npm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ github.ref_name }}
          path: |
            dist/
            package.json
            README.md
            LICENSE
            CHANGELOG.md
      # TODO(release): uncomment after NPM_TOKEN secret is added
      # - run: bun publish --access public
      #   env:
      #     NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-binary:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: bun run build:binary
      - uses: actions/upload-artifact@v4
        with:
          name: mockstar-binary-${{ matrix.os }}-${{ github.ref_name }}
          path: dist/mockstar*

  build-docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          load: true
          tags: |
            mockstar:${{ github.ref_name }}
            mockstar:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # TODO(release): uncomment after GHCR write access is configured
      # - uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      # - uses: docker/build-push-action@v6
      #   with:
      #     context: .
      #     file: ./Dockerfile
      #     platforms: linux/amd64,linux/arm64
      #     push: true
      #     tags: |
      #       ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      #       ghcr.io/${{ github.repository }}:latest

  summary:
    runs-on: ubuntu-24.04
    needs: [build-npm, build-binary, build-docker]
    steps:
      - name: Print release status
        run: |
          echo "Release ${{ github.ref_name }} built successfully."
          echo "Artifacts uploaded. Publishing is manual — uncomment TODO(release) blocks once secrets are set."
