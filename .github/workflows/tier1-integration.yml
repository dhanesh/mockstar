name: tier1-integration

# Satisfies: G1 + G2 + G9 — live-OS integration for `mockstar proxy`.
# Runs on every push + PR. Promotes RT-5, RT-6, RT-11 from IMPLEMENTED -> TESTED.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/features/proxy/**'
      - 'scripts/tier1-integration-smoke.sh'
      - 'Dockerfile.tier1-proxy'
      - '.github/workflows/tier1-integration.yml'

concurrency:
  group: tier1-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-integration:
    name: linux (ubuntu-24.04 + dnsmasq + mkcert)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build the tier1-proxy test image
        run: docker build -f Dockerfile.tier1-proxy -t mockstar-tier1-test:${{ github.sha }} .

      - name: Run the integration smoke test in the container
        run: |
          docker run --rm \
            --cap-add=NET_BIND_SERVICE \
            --name mockstar-tier1-smoke \
            mockstar-tier1-test:${{ github.sha }}

  macos-integration:
    name: macos (self-hosted; manual dispatch only in v1)
    runs-on: macos-14
    timeout-minutes: 10
    # NOTE: Apple's hosted runners don't allow sudoless mkcert install into the
    # system Keychain. This job is opt-in via workflow_dispatch for now; self-hosted
    # Mac runners operated by the project can automate it.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }

      - name: Install prerequisites (brew)
        run: |
          brew install mkcert nss dnsmasq

      - name: Run integration smoke (hosts-fallback mode to avoid /etc/resolver edits)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          bash scripts/tier1-integration-smoke.sh

  bench-capture:
    name: bench baseline capture (linux)
    runs-on: ubuntu-24.04
    needs: [linux-integration]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the tier1-proxy test image
        run: docker build -f Dockerfile.tier1-proxy -t mockstar-tier1-bench:${{ github.sha }} .
      - name: Run bench inside the container
        run: |
          docker run --rm \
            --cap-add=NET_BIND_SERVICE \
            -v "$PWD/bench:/app/bench-out" \
            mockstar-tier1-bench:${{ github.sha }} \
            bash -c "bash scripts/tier1-integration-smoke.sh && cp bench/baselines.json /app/bench-out/tier1-proxy-baseline-$(git rev-parse --short HEAD).json || true"
      - name: Upload bench baseline
        uses: actions/upload-artifact@v4
        with:
          name: tier1-proxy-bench-${{ github.sha }}
          path: bench/tier1-proxy-baseline-*.json
          if-no-files-found: warn
