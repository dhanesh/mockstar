{{/* Satisfies: RT-12 (/metrics scrape for Prometheus). */}}
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "mockstar.fullname" . }}
  labels:
    {{- include "mockstar.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "mockstar.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.service.metricsPath }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
