{{/*
Satisfies: RT-11 (labeled ConfigMap tenant selector — TN5 resolution)
           RT-12 (liveness / readiness probes)

SINGLE-REPLICA / Recreate by design: mockstar's journal, active-scenario state,
and webhook retry queue are in-memory and per-pod. We never run two pods at once,
so the strategy is Recreate (no rolling surge) and replicaCount defaults to 1.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mockstar.fullname" . }}
  labels:
    {{- include "mockstar.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Stateful in-memory server — tear the old pod down before the new one starts.
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      {{- include "mockstar.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mockstar.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # RT-11: rolling this annotation forces a restart when tenant-set content
        # changes under the label selector (k8s does not rehash projected volumes).
        # Update it via kubectl rollout restart or a controller if live.
        mockstar.dev/tenant-hash: {{ now | date "2006-01-02T15:04:05Z" | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "mockstar.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mockstar
          # RT-4: prefer digest over tag when set.
          image: {{ include "mockstar.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args: ["{{ .Values.tenants.mountPathPrefix }}"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: MOCKSTAR_HOST
              value: "0.0.0.0"
            - name: MOCKSTAR_PORT
              value: {{ .Values.service.port | quote }}
            {{- if .Values.admin.existingSecret }}
            - name: MOCKSTAR_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret }}
                  key: {{ .Values.admin.existingSecretKey }}
            {{- end }}
            {{- if .Values.allowWebhookUrlHeader }}
            - name: MOCKSTAR_ALLOW_WEBHOOK_URL_HEADER
              value: "1"
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tenants
              mountPath: {{ .Values.tenants.mountPathPrefix }}
              readOnly: true
            {{- if .Values.handlers.configMap }}
            # Optional named dynamic-mock handlers. Mounted read-only at
            # /config/handlers so the CLI's default ../handlers resolution finds it.
            - name: handlers
              mountPath: {{ .Values.handlers.mountPath }}
              readOnly: true
            {{- end }}
            # readOnlyRootFilesystem is true — back every writable path with an
            # emptyDir so the process can use /tmp and the journal scratch dir.
            - name: tmp
              mountPath: {{ .Values.writableVolumes.tmp.mountPath }}
            - name: journal
              mountPath: {{ .Values.writableVolumes.journal.mountPath }}
      volumes:
        # RT-11: projected volume composed of every ConfigMap in the release
        # namespace matching the tenants.labelSelector. This is the load-bearing
        # piece of TN5 — tenant content is applied out-of-chart and discovered
        # via label, so `helm upgrade` and `helm rollback` never touch it.
        #
        # Helm cannot enumerate ConfigMaps by label at render time, so the chart
        # renders an empty configMap projection keyed off the selector label. A
        # cluster controller / kustomize overlay populates the concrete sources;
        # `sources: []` is a valid (empty) projection until then.
        - name: tenants
          projected:
            sources: []
            {{- range .Values.tenants.labelSelector.matchExpressions }}
            # selector: {{ .key }} {{ .operator }} {{ if .values }}{{ .values | join "," }}{{ end }}
            {{- end }}
        {{- if .Values.handlers.configMap }}
        - name: handlers
          configMap:
            name: {{ .Values.handlers.configMap }}
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.writableVolumes.tmp.sizeLimit }}
        - name: journal
          emptyDir:
            sizeLimit: {{ .Values.writableVolumes.journal.sizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
