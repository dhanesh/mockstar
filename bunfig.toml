[install]
exact = true

[test]
coverage = true
# No coverageThreshold: bun enforces it per-file, and several modules are 0% under
# `bun test` by design — proxy/** is integration-tested in tier1-integration.yml and
# examples/handlers/** are demos. A per-file gate can't express that. Coverage is still
# reported in CI logs; a future aggregate-% gate is the right tool if we want one.
preload = ["./tests/setup.ts"]
